# =====================================================================================================
# Raijin Shield — production sur le VPS (projet Compose « raijin », PROMPT.md §7, docs/DEPLOY.md).
#
# Lancé UNIQUEMENT par infra/deploy.sh (à la main par l'utilisateur, ou par infra/deploy-gate.sh lors du déploiement
# continu, docs/DEPLOY.md partie C ; jamais par un agent) :
#   docker compose --env-file infra/.env -f infra/docker-compose.yml -p raijin …
#
# Deux environnements sur le même VPS, côte à côte, sans aucun nom commun :
#   prod  projet « raijin »      RAIJIN_NAME=raijin (défaut)   ce fichier seul
#   dev   projet « raijin-dev »  RAIJIN_NAME=raijin-dev        ce fichier + docker-compose.env-dev.yml
# RAIJIN_NAME préfixe les conteneurs, images, routeurs / middlewares / services Traefik, réseau interne et volumes.
# Les noms de SERVICE (raijin-postgres, raijin-api…) restent identiques : ils ne sont résolus que dans le réseau
# interne propre à chaque projet (Postgres et Redis ne rejoignent jamais le réseau Traefik).
#
# Cohabitation avec MyTradingCoach / XMR Trader : Raijin ne publie AUCUN port sur l'hôte (pas de 80/443),
# ne lance pas de second reverse proxy et ne touche à aucun conteneur, volume ou réseau existant. Il rejoint
# seulement le réseau EXTERNE du Traefik déjà en place (nom dans TRAEFIK_NETWORK) et s'y déclare par labels.
# Tous les noms (conteneurs, routeurs, middlewares, volumes, réseaux) commencent par « raijin- » (RAIJIN_NAME).
#
# Fichiers de variables (jamais commités, ignorés par .gitignore) :
#   infra/.env      → interpolation de ce fichier : domaines, Traefik, mots de passe Postgres/Redis, basicAuth,
#                     variables publiques du build de la landing (docs/ENV.md, bloc « Production (VPS) »).
#   infra/.env.api  → variables applicatives de raijin-api (docs/ENV.md, blocs applicatifs).
#   infra/.env.bench-api → variables applicatives de raijin-bench-api (docs/ENV.md, bloc « Banc »).
# Les valeurs qui doivent être justes en production sont IMPOSÉES ci-dessous (environment l'emporte sur
# env_file) : NODE_ENV, API_PORT, DATABASE_URL, REDIS_URL, TRUST_PROXY, COOKIE_SECURE, URLs, CORS.
#
# Profils : (aucun) = Raijin ; « bench » = banc de test (phase 8 bis) ; « tools » = migrations Prisma (raijin-migrate,
# raijin-bench-migrate).
# Mots de passe Postgres/Redis : hexadécimaux (openssl rand -hex 32), insérés tels quels dans des URL.
# =====================================================================================================
name: raijin

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true

x-build: &build
  context: ..
  dockerfile: infra/docker/Dockerfile

services:
  # ---------------------------------------------------------------------------------------------------
  # Base de données : bases « raijin » et « raijin_bench », un utilisateur chacune, aucun droit croisé
  # (infra/postgres/init/10-raijin-databases.sh). Superutilisateur « postgres » réservé à l'administration
  # (sauvegardes, restauration). Réseau interne seulement : jamais exposé.
  # ---------------------------------------------------------------------------------------------------
  raijin-postgres:
    image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    container_name: ${RAIJIN_NAME:-raijin}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD manquant (infra/.env)}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8'
      RAIJIN_DB_PASSWORD: ${RAIJIN_DB_PASSWORD:?RAIJIN_DB_PASSWORD manquant (infra/.env)}
      BENCH_DB_PASSWORD: ${BENCH_DB_PASSWORD:?BENCH_DB_PASSWORD manquant (infra/.env)}
    # Réglages pour ~512 Mo : la RAM du VPS est partagée avec MTC.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=2000
    volumes:
      - raijin-pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 128m
    networks:
      - raijin-internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres -q']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # ---------------------------------------------------------------------------------------------------
  # Redis : rate limiting, caches (TTL) et files BullMQ. noeviction obligatoire (une clé de job évincée
  # corromprait les files, docs/ARCHITECTURE.md §11.3). AOF pour ne pas perdre les jobs au redémarrage.
  # ACL par application (docs/ARCHITECTURE.md §17.5, M6) : fichier ACL écrit en mémoire au démarrage depuis les
  # variables (jamais sur la ligne de commande) :
  #   raijin-api    (REDIS_PASSWORD)        clés et canaux raijin:*        (API Raijin : keyPrefix + BullMQ « raijin »)
  #   raijin-bench  (REDIS_BENCH_PASSWORD)  clés et canaux raijin-bench:*  (banc ; désactivé si la variable est vide)
  #   default       désactivé (aucune connexion anonyme)
  # Commandes : tout sauf @dangerous / @admin (FLUSHALL, KEYS, CONFIG, DEBUG, MONITOR, CLIENT LIST|KILL…), INFO rendu
  # (BullMQ et ioredis le lisent), et sans SCAN / RANDOMKEY (ils listeraient les clés de l'autre application),
  # SCRIPT FLUSH|KILL ni FUNCTION (partagés par toutes les connexions).
  # ---------------------------------------------------------------------------------------------------
  raijin-redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    container_name: ${RAIJIN_NAME:-raijin}-redis
    restart: unless-stopped
    user: redis
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        umask 077
        bench="$${REDIS_BENCH_PASSWORD:-}"
        for v in "$$REDIS_PASSWORD" "$${bench:-x}"; do
          case "$$v" in
            ''|*[!A-Za-z0-9_-]*) echo 'raijin-redis : mot de passe Redis invalide (openssl rand -hex 32)' >&2; exit 1 ;;
          esac
        done
        if [ "$$bench" = "$$REDIS_PASSWORD" ]; then
          echo 'raijin-redis : REDIS_BENCH_PASSWORD doit différer de REDIS_PASSWORD' >&2; exit 1
        fi
        rules='+@all -@dangerous -@admin +info -scan -randomkey -script|flush -script|kill -function'
        {
          echo 'user default off resetpass resetkeys resetchannels -@all'
          printf 'user raijin-api on resetpass >%s resetkeys ~raijin:* resetchannels &raijin:* %s\n' "$$REDIS_PASSWORD" "$$rules"
          if [ -n "$$bench" ]; then
            printf 'user raijin-bench on resetpass >%s resetkeys ~raijin-bench:* resetchannels &raijin-bench:* %s\n' "$$bench" "$$rules"
          else
            echo 'user raijin-bench off resetpass resetkeys resetchannels -@all'
          fi
        } > /tmp/users.acl
        case "$${REDIS_MAXMEMORY%mb}" in
          ''|0*|*[!0-9]*) echo 'raijin-redis : REDIS_MAXMEMORY invalide (ex. 200mb)' >&2; exit 1 ;;
        esac
        unset REDIS_PASSWORD REDIS_BENCH_PASSWORD bench
        exec redis-server --aclfile /tmp/users.acl \
          --appendonly yes --appendfsync everysec --save '' \
          --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy noeviction \
          --protected-mode yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant (infra/.env)}
      # Vide tant que le banc n'est pas déployé (utilisateur raijin-bench désactivé) ; exigé par deploy.sh --bench.
      REDIS_BENCH_PASSWORD: ${REDIS_BENCH_PASSWORD:-}
      # Plafond des données (200mb en production ; réduit pour l'environnement dev, docker-compose.env-dev.yml).
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-200mb}
      # Healthcheck (redis-cli --user raijin-api) : mot de passe lu dans l'environnement, jamais en argument.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - raijin-redisdata:/data
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=0700,uid=999
    networks:
      - raijin-internal
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning --user raijin-api ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100
    <<: *hardening
    logging: *logging

  # ---------------------------------------------------------------------------------------------------
  # Migrations Prisma (profil « tools ») : lancé par deploy.sh AVANT de démarrer la nouvelle API.
  #   docker compose … --profile tools run --rm raijin-migrate
  # Image minimale (CLI Prisma + schéma + migrations), moteur téléchargé au build : réseau interne seulement.
  # ---------------------------------------------------------------------------------------------------
  raijin-migrate:
    profiles: ['tools']
    image: ${RAIJIN_NAME:-raijin}/migrate:${RAIJIN_TAG:-latest}
    build:
      <<: *build
      target: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://raijin:${RAIJIN_DB_PASSWORD}@raijin-postgres:5432/raijin?schema=public
    read_only: true
    tmpfs:
      - /tmp:size=64m
    networks:
      - raijin-internal
    depends_on:
      raijin-postgres:
        condition: service_healthy
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 100
    <<: *hardening
    logging: *logging

  # ---------------------------------------------------------------------------------------------------
  # Migrations Prisma du banc (profil « tools ») : base raijin_bench, utilisateur raijin_bench (aucun droit sur
  # raijin). Lancé par deploy.sh --bench AVANT de démarrer la nouvelle API du banc :
  #   docker compose … --profile tools run --rm raijin-bench-migrate
  # ---------------------------------------------------------------------------------------------------
  raijin-bench-migrate:
    profiles: ['tools']
    image: ${RAIJIN_NAME:-raijin}/bench-migrate:${RAIJIN_TAG:-latest}
    build:
      <<: *build
      target: bench-migrate
    environment:
      NODE_ENV: production
      BENCH_DATABASE_URL: postgresql://raijin_bench:${BENCH_DB_PASSWORD}@raijin-postgres:5432/raijin_bench?schema=public
    read_only: true
    tmpfs:
      - /tmp:size=64m
    networks:
      - raijin-internal
    depends_on:
      raijin-postgres:
        condition: service_healthy
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 100
    <<: *hardening
    logging: *logging

  # ---------------------------------------------------------------------------------------------------
  # API NestJS : api.raijinshield.com (webhook Stripe, images OG, santé) ET app.raijinshield.com/api/*
  # (le front appelle « /api/v1 » en relatif : même origine, pas de CORS ni de cookie inter-domaines).
  # /t/<mint> de l'app est réécrit vers /api/v1/share/t/<mint> (balises Open Graph, §9.7).
  # Toutes les requêtes passent par UN seul proxy (Traefik) : TRUST_PROXY=1 est exact.
  # ---------------------------------------------------------------------------------------------------
  raijin-api:
    image: ${RAIJIN_NAME:-raijin}/api:${RAIJIN_TAG:-latest}
    build:
      <<: *build
      target: api
    container_name: ${RAIJIN_NAME:-raijin}-api
    restart: unless-stopped
    env_file:
      # Facultatif pour Compose afin que `docker buildx bake` (job CI « images ») puisse lire ce fichier sans lui ;
      # en production, infra/deploy.sh refuse de continuer s'il est absent, et l'API refuse de démarrer sans secrets.
      - path: ${RAIJIN_API_ENV_FILE:-.env.api}
        required: false
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      NODE_OPTIONS: --max-old-space-size=384
      APP_URL: https://${APP_DOMAIN:?APP_DOMAIN manquant}
      LANDING_URL: https://${LANDING_DOMAIN:?LANDING_DOMAIN manquant}
      API_URL: https://${API_DOMAIN:?API_DOMAIN manquant}
      CORS_ORIGINS: https://${APP_DOMAIN}
      DATABASE_URL: postgresql://raijin:${RAIJIN_DB_PASSWORD}@raijin-postgres:5432/raijin?schema=public
      # Utilisateur ACL raijin-api (clés raijin:* seulement) ; BullMQ « raijin » → clés raijin:<file>:*.
      REDIS_URL: redis://raijin-api:${REDIS_PASSWORD}@raijin-redis:6379
      BULLMQ_PREFIX: raijin
      TRUST_PROXY: '1'
      # Secret de l'en-tête X-Raijin-Edge posé par Traefik (vide en dev : contrôle inactif, docs/SECURITY.md §17)
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:-}
      COOKIE_SECURE: 'true'
      COOKIE_DOMAIN: ''
      WEB_INDEX_HTML_PATH: /app/web/index.html
      ANALYSIS_FIXTURES: '0'
      JOBS_TEST_TRIGGER: '0'
    read_only: true
    tmpfs:
      - /tmp:size=64m
    networks:
      - raijin-internal
      - traefik
    depends_on:
      raijin-postgres:
        condition: service_healthy
      raijin-redis:
        condition: service_healthy
    stop_grace_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    <<: *hardening
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK manquant}
      - traefik.http.services.${RAIJIN_NAME:-raijin}-api.loadbalancer.server.port=3000
      - traefik.http.services.${RAIJIN_NAME:-raijin}-api.loadbalancer.healthcheck.path=/api/v1/health
      - traefik.http.services.${RAIJIN_NAME:-raijin}-api.loadbalancer.healthcheck.interval=30s
      # api.raijinshield.com
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-api.tls=true
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER manquant}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-api.service=${RAIJIN_NAME:-raijin}-api
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-api.middlewares=${RAIJIN_NAME:-raijin}-api-ratelimit,${RAIJIN_NAME:-raijin}-api-headers,${RAIJIN_NAME:-raijin}-api-compress
      # app.raijinshield.com/api/* (priorité au-dessus du routeur du front)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api/`)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-api.priority=100
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-api.tls=true
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-api.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-api.service=${RAIJIN_NAME:-raijin}-api
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-api.middlewares=${RAIJIN_NAME:-raijin}-api-ratelimit,${RAIJIN_NAME:-raijin}-api-headers,${RAIJIN_NAME:-raijin}-api-compress
      # app.raijinshield.com/t/<mint> → /api/v1/share/t/<mint> (CSP posée par l'API, alignée sur celle de l'app)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-share.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/t/`)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-share.priority=100
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-share.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-share.tls=true
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-share.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-share.service=${RAIJIN_NAME:-raijin}-api
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-app-share.middlewares=${RAIJIN_NAME:-raijin}-api-ratelimit,${RAIJIN_NAME:-raijin}-share-errors,${RAIJIN_NAME:-raijin}-share-rewrite,${RAIJIN_NAME:-raijin}-share-headers,${RAIJIN_NAME:-raijin}-api-compress
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-rewrite.replacepathregex.regex=^/t/(.*)
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-rewrite.replacepathregex.replacement=/api/v1/share/t/$${1}
      # API indisponible sur /t : page statique de maintenance servie par raijin-web
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-errors.errors.status=502-504
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-errors.errors.service=${RAIJIN_NAME:-raijin}-web
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-errors.errors.query=/maintenance-static.html
      # Débit global par IP (l'API a en plus ses limites fines par route et par compte)
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-ratelimit.ratelimit.burst=60
      # En-têtes de l'API (Helmet pose déjà CSP default-src 'none', nosniff, Referrer-Policy no-referrer)
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-headers.headers.stsSeconds=63072000
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-headers.headers.stsPreload=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-headers.headers.frameDeny=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-headers.headers.customResponseHeaders.Server=
      # X-Raijin-Edge (option B du dev, docs/SECURITY.md §17) : secret EDGE_SHARED_SECRET du .env de la PROD (64 hex, généré par
      #   infra/vps-setup.sh) ; vide en dev = en-tête retiré par Traefik. L'API et le banc refusent (403) toute requête sans cet
      #   en-tête valide, sauf la santé : un conteneur voisin du réseau de Traefik (dev, MTC) ne peut pas les joindre en direct.
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-headers.headers.customRequestHeaders.X-Raijin-Edge=${EDGE_SHARED_SECRET:-}
      # En-têtes de /t (document HTML de l'app ; la CSP vient de l'API, sharePageCsp)
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-headers.headers.stsSeconds=63072000
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-headers.headers.stsPreload=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-headers.headers.frameDeny=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=()
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-headers.headers.customResponseHeaders.Server=
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-share-headers.headers.customRequestHeaders.X-Raijin-Edge=${EDGE_SHARED_SECRET:-}
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-compress.compress=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-api-compress.compress.excludedcontenttypes=text/event-stream

  # ---------------------------------------------------------------------------------------------------
  # App Angular (fichiers statiques, nginx non root) : app.raijinshield.com
  # style-src 'unsafe-inline' : Angular injecte les styles de composants dans des <style> à l'exécution
  # (décision phase 8, PROGRESS.md) ; script-src reste strict ('self' seulement). img-src data: : QR de la 2FA.
  # ---------------------------------------------------------------------------------------------------
  raijin-web:
    image: ${RAIJIN_NAME:-raijin}/web:${RAIJIN_TAG:-latest}
    build:
      <<: *build
      target: web
    container_name: ${RAIJIN_NAME:-raijin}-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=101
    networks:
      - traefik
    mem_limit: 48m
    memswap_limit: 48m
    cpus: 0.25
    pids_limit: 50
    <<: *hardening
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.services.${RAIJIN_NAME:-raijin}-web.loadbalancer.server.port=8080
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-web.tls=true
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-web.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-web.service=${RAIJIN_NAME:-raijin}-web
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-web.middlewares=${RAIJIN_NAME:-raijin}-web-headers,${RAIJIN_NAME:-raijin}-web-compress
      - "traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://${API_DOMAIN}; font-src 'self'; connect-src 'self' https://${API_DOMAIN}; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-headers.headers.stsSeconds=63072000
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-headers.headers.stsPreload=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-headers.headers.frameDeny=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=()
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-headers.headers.customResponseHeaders.Server=
      # En-tête interne de l'environnement dev (robots.txt « Disallow: / », nginx) : toujours retiré ici, posé seulement
      # par docker-compose.env-dev.yml. Un visiteur ne peut donc pas l'envoyer lui-même.
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-headers.headers.customRequestHeaders.X-Raijin-Robots=
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-web-compress.compress=true

  # ---------------------------------------------------------------------------------------------------
  # Landing Astro (fichiers statiques, nginx non root) : raijinshield.com ; www → 301 vers la racine.
  # Variables publiques lues AU BUILD (args) : APP_URL, GA4_MEASUREMENT_ID, GOOGLE_SITE_VERIFICATION.
  # ---------------------------------------------------------------------------------------------------
  raijin-landing:
    image: ${RAIJIN_NAME:-raijin}/landing:${RAIJIN_TAG:-latest}
    build:
      <<: *build
      target: landing
      args:
        APP_URL: https://${APP_DOMAIN}
        GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    container_name: ${RAIJIN_NAME:-raijin}-landing
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=101
    networks:
      - traefik
    mem_limit: 48m
    memswap_limit: 48m
    cpus: 0.25
    pids_limit: 50
    <<: *hardening
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.services.${RAIJIN_NAME:-raijin}-landing.loadbalancer.server.port=8080
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-landing.rule=Host(`${LANDING_DOMAIN}`)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-landing.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-landing.tls=true
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-landing.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-landing.service=${RAIJIN_NAME:-raijin}-landing
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-landing.middlewares=${RAIJIN_NAME:-raijin}-landing-headers,${RAIJIN_NAME:-raijin}-landing-compress
      # www.raijinshield.com → https://raijinshield.com (301, chemin et requête conservés)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-www.rule=Host(`www.${LANDING_DOMAIN}`)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-www.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-www.tls=true
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-www.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-www.service=${RAIJIN_NAME:-raijin}-landing
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-www.middlewares=${RAIJIN_NAME:-raijin}-www-redirect
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-www-redirect.redirectregex.regex=^https?://www\.([^/:]+)(?::\d+)?/(.*)$$
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-www-redirect.redirectregex.replacement=https://$${1}/$${2}
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-www-redirect.redirectregex.permanent=true
      - "traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; font-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://${APP_DOMAIN}; object-src 'none'"
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-headers.headers.stsSeconds=63072000
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-headers.headers.stsPreload=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-headers.headers.frameDeny=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=()
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-headers.headers.customResponseHeaders.Server=
      # En-tête interne de l'environnement dev (robots.txt « Disallow: / », nginx) : toujours retiré ici, posé seulement
      # par docker-compose.env-dev.yml. Un visiteur ne peut donc pas l'envoyer lui-même.
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-headers.headers.customRequestHeaders.X-Raijin-Robots=
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-landing-compress.compress=true

  # ===================================================================================================
  # Banc de test (profil « bench », phase 8 bis) : banc.raijinshield.com, double verrou (PROMPT.md §4.8) :
  # basicAuth Traefik en amont (hash dans BENCH_BASIC_AUTH_USERS) + auth propre de l'API du banc (compte unique,
  # mot de passe + TOTP, docs/ARCHITECTURE.md §17.7). Démarré seulement par infra/deploy.sh --bench.
  #
  # API du banc : variables applicatives dans infra/.env.bench-api (modèle : docs/ENV.md, « Banc ») ; celles qui
  # doivent être justes sont IMPOSÉES ci-dessous (environment l'emporte sur env_file ; noms lus par bench-core,
  # libs/bench/core/src/lib/config/bench-config.ts). Postgres : utilisateur raijin_bench (base raijin_bench seule,
  # vérifié par bench-core) ; Redis : utilisateur ACL raijin-bench (clés raijin-bench:* seules).
  # ===================================================================================================
  raijin-bench-api:
    profiles: ['bench']
    image: ${RAIJIN_NAME:-raijin}/bench-api:${RAIJIN_TAG:-latest}
    build:
      <<: *build
      target: bench-api
    container_name: ${RAIJIN_NAME:-raijin}-bench-api
    restart: unless-stopped
    env_file:
      # Facultatif pour Compose (docker compose config / build en CI) ; infra/deploy.sh --bench refuse de continuer
      # s'il est absent, et l'API du banc refuse de démarrer sans ses secrets.
      - path: ${RAIJIN_BENCH_API_ENV_FILE:-.env.bench-api}
        required: false
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      NODE_OPTIONS: --max-old-space-size=320
      # Origine du front du banc (contrôle Origin / CSRF de bench-core) : même origine que l'API (/api/).
      BENCH_ALLOWED_ORIGINS: https://${BENCH_DOMAIN:-banc.raijinshield.com}
      BENCH_DATABASE_URL: postgresql://raijin_bench:${BENCH_DB_PASSWORD}@raijin-postgres:5432/raijin_bench?schema=public
      BENCH_REDIS_URL: redis://raijin-bench:${REDIS_BENCH_PASSWORD:-}@raijin-redis:6379
      # BullMQ du banc → clés raijin-bench:<file>:* (autorisées par l'ACL raijin-bench ; bench-core refuse une autre valeur).
      BULLMQ_PREFIX: raijin-bench
      # Un seul proxy (Traefik) devant l'API du banc.
      TRUST_PROXY: '1'
      # Secret de l'en-tête X-Raijin-Edge posé par Traefik (vide en dev : contrôle inactif, docs/SECURITY.md §17)
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:-}
      COOKIE_SECURE: 'true'
    read_only: true
    tmpfs:
      - /tmp:size=32m
    networks:
      - raijin-internal
      - traefik
    depends_on:
      raijin-postgres:
        condition: service_healthy
      raijin-redis:
        condition: service_healthy
    stop_grace_period: 30s
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.75
    pids_limit: 200
    <<: *hardening
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.services.${RAIJIN_NAME:-raijin}-bench-api.loadbalancer.server.port=3000
      - traefik.http.services.${RAIJIN_NAME:-raijin}-bench-api.loadbalancer.healthcheck.path=/api/health
      - traefik.http.services.${RAIJIN_NAME:-raijin}-bench-api.loadbalancer.healthcheck.interval=30s
      # banc.raijinshield.com/api/* (priorité au-dessus du routeur du front)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-api.rule=Host(`${BENCH_DOMAIN:-banc.raijinshield.com}`) && PathPrefix(`/api/`)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-api.priority=100
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-api.tls=true
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-api.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-api.service=${RAIJIN_NAME:-raijin}-bench-api
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-api.middlewares=${RAIJIN_NAME:-raijin}-bench-auth,${RAIJIN_NAME:-raijin}-bench-api-ratelimit,${RAIJIN_NAME:-raijin}-bench-api-headers,${RAIJIN_NAME:-raijin}-bench-api-compress
      # SSE (GET /api/events, §17.4) : routeur dédié SANS compression (un flux compressé est mis en tampon) ; Traefik
      # ne met pas les réponses en tampon (aucun middleware buffering) et vide text/event-stream à chaque écriture.
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-events.rule=Host(`${BENCH_DOMAIN:-banc.raijinshield.com}`) && Path(`/api/events`)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-events.priority=110
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-events.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-events.tls=true
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-events.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-events.service=${RAIJIN_NAME:-raijin}-bench-api
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-events.middlewares=${RAIJIN_NAME:-raijin}-bench-auth,${RAIJIN_NAME:-raijin}-bench-api-ratelimit,${RAIJIN_NAME:-raijin}-bench-api-headers
      # basicAuth (en-tête Authorization retiré avant l'API : elle ne voit que son propre cookie de session)
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-auth.basicauth.users=${BENCH_BASIC_AUTH_USERS:-}
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-auth.basicauth.removeheader=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-auth.basicauth.realm=Raijin-banc-de-test
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-ratelimit.ratelimit.average=10
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-ratelimit.ratelimit.burst=40
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-headers.headers.stsSeconds=63072000
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-headers.headers.frameDeny=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-headers.headers.customResponseHeaders.Server=
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-headers.headers.customRequestHeaders.X-Raijin-Edge=${EDGE_SHARED_SECRET:-}
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-compress.compress=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-api-compress.compress.excludedcontenttypes=text/event-stream

  raijin-bench-web:
    profiles: ['bench']
    image: ${RAIJIN_NAME:-raijin}/bench-web:${RAIJIN_TAG:-latest}
    build:
      <<: *build
      target: bench-web
    container_name: ${RAIJIN_NAME:-raijin}-bench-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=101
    networks:
      - traefik
    mem_limit: 48m
    memswap_limit: 48m
    cpus: 0.25
    pids_limit: 50
    <<: *hardening
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.services.${RAIJIN_NAME:-raijin}-bench-web.loadbalancer.server.port=8080
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-web.rule=Host(`${BENCH_DOMAIN:-banc.raijinshield.com}`)
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-web.tls=true
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-web.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-web.service=${RAIJIN_NAME:-raijin}-bench-web
      - traefik.http.routers.${RAIJIN_NAME:-raijin}-bench-web.middlewares=${RAIJIN_NAME:-raijin}-bench-auth,${RAIJIN_NAME:-raijin}-bench-web-headers,${RAIJIN_NAME:-raijin}-bench-web-compress
      - "traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-web-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-web-headers.headers.stsSeconds=63072000
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-web-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-web-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-web-headers.headers.frameDeny=true
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-web-headers.headers.referrerPolicy=no-referrer
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-web-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=()
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-web-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-web-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-web-headers.headers.customResponseHeaders.Server=
      - traefik.http.middlewares.${RAIJIN_NAME:-raijin}-bench-web-compress.compress=true

networks:
  # Postgres et Redis : réseau interne Docker, sans accès extérieur ni port publié.
  raijin-internal:
    name: ${RAIJIN_NAME:-raijin}-internal
    internal: true
  # Réseau du Traefik existant (créé par MTC, jamais modifié ici) : nom vérifié par `docker network ls`.
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true

volumes:
  raijin-pgdata:
    name: ${RAIJIN_NAME:-raijin}-pgdata
  raijin-redisdata:
    name: ${RAIJIN_NAME:-raijin}-redisdata
