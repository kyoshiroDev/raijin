# raijin-bench-web : front du banc (banc.raijinshield.com), fichiers de dist/apps/raijin-banc-de-test/browser.
# Profil Compose « bench » (phase 8 bis). Protégé en amont par le basicAuth Traefik ; jamais indexé.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  if ($raijin_bad_method) {
    return 405;
  }

  # Ceinture et bretelles : Traefik pose aussi X-Robots-Tag (et l'écrase).
  add_header X-Robots-Tag "noindex, nofollow" always;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /robots.txt {
    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location ~* "^/(?:main|chunk|polyfills|styles|scripts|worker)-[A-Za-z0-9_-]{8,}\.(?:js|mjs|css)$" {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ "^/(?:ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$" {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* "\.[a-z0-9]{1,12}$" {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location / {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
