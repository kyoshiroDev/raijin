# nginx principal des conteneurs statiques Raijin (raijin-web, raijin-landing, raijin-bench-web).
# Exécuté en utilisateur « nginx » (non root), système de fichiers en lecture seule : tout fichier
# temporaire va dans /tmp (tmpfs). Écoute sur 8080, joint uniquement par Traefik.
# Les en-têtes de sécurité (CSP, HSTS, Permissions-Policy…) et la compression sont posés par Traefik
# (labels de infra/docker-compose.yml) : nginx ne gère que les fichiers, le cache et les redirections.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/manifest+json webmanifest;
  }

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Pas de journal d'accès ici (Traefik journalise déjà ; évite d'écrire des URL avec paramètres UTM).
  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # Compression faite par Traefik (middleware compress).
  gzip off;
  # Redirections relatives : nginx voit http://…:8080, le visiteur https://domaine.
  absolute_redirect off;
  port_in_redirect off;
  client_max_body_size 16k;
  # Méthodes : un site statique n'accepte que GET et HEAD.
  map $request_method $raijin_bad_method {
    default 1;
    GET 0;
    HEAD 0;
  }

  include /etc/nginx/conf.d/*.conf;
}
