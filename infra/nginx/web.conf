# raijin-web : app Angular (app.raijinshield.com), fichiers de dist/apps/web/browser.
# Routage Traefik en amont : /api/* et /t/* vont directement à raijin-api (jamais ici).
# CSP et en-têtes de sécurité : Traefik (middleware raijin-web-headers).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  if ($raijin_bad_method) {
    return 405;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # robots.txt : aucun fichier en production (tout est indexable sauf ce que l'app marque noindex) ; en dev,
  # « Disallow: / » (en-tête interne X-Raijin-Robots posé par Traefik, nginx.conf).
  location = /robots.txt {
    default_type text/plain;
    if ($raijin_robots_deny) {
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "no-cache" always;
      return 200 "User-agent: *\nDisallow: /\n";
    }
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Fichiers hachés du build Angular (main-XXXXXXXX.js, chunk-…, polyfills-…, styles-….css) : immuables.
  location ~* "^/(?:main|chunk|polyfills|styles|scripts|worker)-[A-Za-z0-9_-]{8,}\.(?:js|mjs|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker (PWA) et sa configuration : toujours revalidés, sinon l'app ne se met plus à jour.
  location ~ "^/(?:ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$" {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Documents HTML (index.html, maintenance-static.html servi par Traefik si l'API tombe) : jamais en cache.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Polices, icônes, mascotte, images des e-mails : noms stables, 7 jours.
  location ~ "^/(?:fonts|icons|brand|email)/" {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Tout autre fichier avec extension : servi s'il existe, sinon 404 (pas de repli SPA sur un fichier manquant).
  location ~* "\.[a-z0-9]{1,12}$" {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Routes de l'app (/analyse, /analyse/<mint>, /suivis, /compte…) : repli SPA sur index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
