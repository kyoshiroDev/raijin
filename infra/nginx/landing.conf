# raijin-landing : landing Astro (raijinshield.com), fichiers de dist/apps/landing (build.format: 'file').
# Règles (docs/DEPLOY.md, partie B §6.2) :
#   /x          → fichier x.html (sinon x/index.html), 404 avec 404.html sinon ;
#   /x.html, /x/ et /x/index.html → 301 vers /x (une seule URL par page ; requête conservée) ;
#   /_astro/*   → immuable (fichiers hachés) ; HTML, sitemap, robots, /og → cache court.
# CSP et en-têtes de sécurité : Traefik (middleware raijin-landing-headers).

# URL canonique calculée sur l'URI D'ORIGINE ($request_uri) : les redirections internes (try_files,
# error_page) ne bouclent jamais. Les chemins commençant par « // » ou « /\ » ne sont jamais redirigés
# (sinon Location « //domaine » = redirection ouverte).
map $request_uri $raijin_canonical {
  default "";
  "~^/index\.html(?<rq>\?.*)?$" "/$rq";
  "~^(?<rp>/(?![/\x5c])[^?]*?)/index\.html(?<rq>\?.*)?$" "$rp$rq";
  "~^(?<rp>/(?![/\x5c])[^?]*?)\.html(?<rq>\?.*)?$" "$rp$rq";
  "~^(?<rp>/(?![/\x5c])[^?]*?[^/?])/+(?<rq>\?.*)?$" "$rp$rq";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  if ($raijin_bad_method) {
    return 405;
  }
  if ($raijin_canonical) {
    return 301 $raijin_canonical;
  }

  error_page 404 /404.html;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # La page 404 n'est jamais servie en 200 sous /404.
  location = /404 {
    return 404;
  }
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
  }

  # Fichiers hachés d'Astro : immuables.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Images Open Graph (régénérées à chaque build, noms stables) : 1 jour.
  location /og/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location ~ "^/(?:robots\.txt|sitemap\.xml)$" {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Icônes et autres fichiers avec extension (hors .html, redirigés plus haut) : 7 jours.
  location ~* "\.(?:png|svg|ico|webp|jpg|jpeg|woff2?|txt|xml|json|webmanifest)$" {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Pages : /x → x.html ; revalidées à chaque visite (contenu mis à jour à chaque déploiement).
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri.html $uri/index.html =404;
  }
}
