# =====================================================================================================
# Raijin Shield — environnement DEV sur le VPS (projet Compose « raijin-dev », docs/DEPLOY.md partie C).
# Surcouche de infra/docker-compose.yml, jamais utilisée seule ni en production :
#   docker compose -p raijin-dev --env-file <env dev> -f infra/docker-compose.yml -f infra/docker-compose.env-dev.yml …
# (infra/deploy.sh --env dev le fait, et vérifie RAIJIN_NAME=raijin-dev). À ne pas confondre avec
# docker-compose.dev.yml à la racine (services locaux du poste de développement).
#
# Différences avec la production :
#   - noms : RAIJIN_NAME=raijin-dev → conteneurs, images, routeurs Traefik, réseau interne et volumes distincts
#     (Postgres, Redis et données propres au dev ; aucun accès à ceux de la prod) ;
#   - accès : basicAuth Traefik (DEV_BASIC_AUTH_USERS) devant l'app, la landing et l'API, sauf sur api-dev pour le
#     webhook Stripe (mode test), la santé et les images Open Graph ; robots.txt « Disallow: / » et
#     X-Robots-Tag noindex partout ;
#   - e-mails : jamais envoyés, capturés par Mailpit (interface : https://<APP_DOMAIN>/_mailpit/, mot de passe dev) ;
#   - ressources réduites (le VPS est partagé avec la production, MTC et XMR Trader) ;
#   - réseau d'entrée (TRAEFIK_NETWORK, choisi par RAIJIN_DEV_EDGE dans le .env du dev, docs/DEPLOY.md C2) :
#       traefik-shared (défaut, option B) : le réseau du Traefik existant, comme la prod ; le conteneur Traefik (créé
#         par MTC) n'est pas modifié. Postgres et Redis du dev restent sur raijin-dev-internal (jamais sur ce réseau) ;
#       dedicated (option A) : réseau raijin-dev-edge propre au dev, rejoint par Traefik (« docker network connect »
#         sur le conteneur de MTC : seulement sur décision explicite de l'utilisateur).
#     Dans les deux cas, aucun réseau interne commun avec la prod (données, cache, secrets distincts).
# Labels en LISTE (comme le fichier de base) : Compose n'interpole pas les clés d'un mapping, et fusionne les labels
# par clé (une clé redéfinie ici remplace celle de la production).
# Stripe en mode test : imposé par infra/deploy.sh --env dev (clé sk_live_ / rk_live_ refusée).
# =====================================================================================================

services:
  raijin-postgres:
    # Réglages pour ~256 Mo.
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
      - -c
      - log_min_duration_statement=2000
    shm_size: 64m
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5

  raijin-redis:
    environment:
      REDIS_MAXMEMORY: 48mb
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.25

  raijin-migrate:
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5

  # ---------------------------------------------------------------------------------------------------
  # Mailpit : reçoit tous les e-mails de l'API dev (aucun relais configuré : rien ne sort). Interface web sous
  # https://<APP_DOMAIN>/_mailpit/, derrière la basicAuth du dev. Messages en mémoire (/tmp), 500 au plus.
  # ---------------------------------------------------------------------------------------------------
  raijin-mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    container_name: ${RAIJIN_NAME}-mailpit
    restart: unless-stopped
    environment:
      MP_WEBROOT: /_mailpit/
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_DISABLE_VERSION_CHECK: 'true'
    read_only: true
    tmpfs:
      - /tmp:size=64m
    networks:
      - raijin-internal
      - traefik
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      # basicAuth du dev (hash bcrypt, docs/DEPLOY.md C4). Même définition sur chaque conteneur exposé : le middleware
      # existe tant qu'un seul d'entre eux tourne (définitions identiques fusionnées par Traefik).
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.users=${DEV_BASIC_AUTH_USERS:?DEV_BASIC_AUTH_USERS manquant (env dev)}
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.removeheader=true
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.realm=Raijin-dev
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.services.${RAIJIN_NAME}-mailpit.loadbalancer.server.port=8025
      - traefik.http.routers.${RAIJIN_NAME}-mailpit.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/_mailpit/`)
      - traefik.http.routers.${RAIJIN_NAME}-mailpit.priority=150
      - traefik.http.routers.${RAIJIN_NAME}-mailpit.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME}-mailpit.tls=true
      - traefik.http.routers.${RAIJIN_NAME}-mailpit.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME}-mailpit.service=${RAIJIN_NAME}-mailpit
      - traefik.http.routers.${RAIJIN_NAME}-mailpit.middlewares=${RAIJIN_NAME}-auth,${RAIJIN_NAME}-mailpit-headers
      - traefik.http.middlewares.${RAIJIN_NAME}-mailpit-headers.headers.stsSeconds=63072000
      - traefik.http.middlewares.${RAIJIN_NAME}-mailpit-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${RAIJIN_NAME}-mailpit-headers.headers.frameDeny=true
      - traefik.http.middlewares.${RAIJIN_NAME}-mailpit-headers.headers.referrerPolicy=no-referrer
      - traefik.http.middlewares.${RAIJIN_NAME}-mailpit-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow

  raijin-api:
    environment:
      NODE_OPTIONS: --max-old-space-size=288
      # E-mails : toujours vers Mailpit, quel que soit le contenu du fichier .env.api du dev.
      MAIL_PROVIDER: smtp
      SMTP_HOST: raijin-mailpit
      SMTP_PORT: '1025'
      RESEND_API_KEY: ''
    depends_on:
      raijin-mailpit:
        condition: service_healthy
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    labels:
      # basicAuth du dev (hash bcrypt, docs/DEPLOY.md C4). Même définition sur chaque conteneur exposé : le middleware
      # existe tant qu'un seul d'entre eux tourne (définitions identiques fusionnées par Traefik).
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.users=${DEV_BASIC_AUTH_USERS:?DEV_BASIC_AUTH_USERS manquant (env dev)}
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.removeheader=true
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.realm=Raijin-dev
      # api-dev : tout derrière la basicAuth…
      - traefik.http.routers.${RAIJIN_NAME}-api.middlewares=${RAIJIN_NAME}-auth,${RAIJIN_NAME}-api-ratelimit,${RAIJIN_NAME}-api-headers,${RAIJIN_NAME}-api-compress
      # … sauf le webhook Stripe (mode test, signé), la santé (déploiement continu) et les images Open Graph : un routeur
      # par chemin (règles strictes Host && Path / PathPrefix, sans « || », exigées par infra/lib/deploy_policy.py).
      - traefik.http.routers.${RAIJIN_NAME}-api-public-webhook.rule=Host(`${API_DOMAIN}`) && Path(`/api/v1/billing/webhook`)
      - traefik.http.routers.${RAIJIN_NAME}-api-public-webhook.priority=100
      - traefik.http.routers.${RAIJIN_NAME}-api-public-webhook.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME}-api-public-webhook.tls=true
      - traefik.http.routers.${RAIJIN_NAME}-api-public-webhook.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME}-api-public-webhook.service=${RAIJIN_NAME}-api
      - traefik.http.routers.${RAIJIN_NAME}-api-public-webhook.middlewares=${RAIJIN_NAME}-api-ratelimit,${RAIJIN_NAME}-api-headers,${RAIJIN_NAME}-api-compress
      - traefik.http.routers.${RAIJIN_NAME}-api-public-health.rule=Host(`${API_DOMAIN}`) && Path(`/api/v1/health`)
      - traefik.http.routers.${RAIJIN_NAME}-api-public-health.priority=100
      - traefik.http.routers.${RAIJIN_NAME}-api-public-health.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME}-api-public-health.tls=true
      - traefik.http.routers.${RAIJIN_NAME}-api-public-health.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME}-api-public-health.service=${RAIJIN_NAME}-api
      - traefik.http.routers.${RAIJIN_NAME}-api-public-health.middlewares=${RAIJIN_NAME}-api-ratelimit,${RAIJIN_NAME}-api-headers,${RAIJIN_NAME}-api-compress
      - traefik.http.routers.${RAIJIN_NAME}-api-public-healthz.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api/v1/health/`)
      - traefik.http.routers.${RAIJIN_NAME}-api-public-healthz.priority=100
      - traefik.http.routers.${RAIJIN_NAME}-api-public-healthz.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME}-api-public-healthz.tls=true
      - traefik.http.routers.${RAIJIN_NAME}-api-public-healthz.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME}-api-public-healthz.service=${RAIJIN_NAME}-api
      - traefik.http.routers.${RAIJIN_NAME}-api-public-healthz.middlewares=${RAIJIN_NAME}-api-ratelimit,${RAIJIN_NAME}-api-headers,${RAIJIN_NAME}-api-compress
      - traefik.http.routers.${RAIJIN_NAME}-api-public-og.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api/v1/og/`)
      - traefik.http.routers.${RAIJIN_NAME}-api-public-og.priority=100
      - traefik.http.routers.${RAIJIN_NAME}-api-public-og.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME}-api-public-og.tls=true
      - traefik.http.routers.${RAIJIN_NAME}-api-public-og.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME}-api-public-og.service=${RAIJIN_NAME}-api
      - traefik.http.routers.${RAIJIN_NAME}-api-public-og.middlewares=${RAIJIN_NAME}-api-ratelimit,${RAIJIN_NAME}-api-headers,${RAIJIN_NAME}-api-compress
      # dev.raijinshield.com/api/* et /t/* : derrière la basicAuth (le navigateur la renvoie seul en même origine).
      - traefik.http.routers.${RAIJIN_NAME}-app-api.middlewares=${RAIJIN_NAME}-auth,${RAIJIN_NAME}-api-ratelimit,${RAIJIN_NAME}-api-headers,${RAIJIN_NAME}-api-compress
      - traefik.http.routers.${RAIJIN_NAME}-app-share.middlewares=${RAIJIN_NAME}-auth,${RAIJIN_NAME}-api-ratelimit,${RAIJIN_NAME}-share-errors,${RAIJIN_NAME}-share-rewrite,${RAIJIN_NAME}-share-headers,${RAIJIN_NAME}-api-compress
      - traefik.http.middlewares.${RAIJIN_NAME}-share-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow

  raijin-web:
    labels:
      # basicAuth du dev (hash bcrypt, docs/DEPLOY.md C4). Même définition sur chaque conteneur exposé : le middleware
      # existe tant qu'un seul d'entre eux tourne (définitions identiques fusionnées par Traefik).
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.users=${DEV_BASIC_AUTH_USERS:?DEV_BASIC_AUTH_USERS manquant (env dev)}
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.removeheader=true
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.realm=Raijin-dev
      - traefik.http.routers.${RAIJIN_NAME}-web.middlewares=${RAIJIN_NAME}-auth,${RAIJIN_NAME}-web-headers,${RAIJIN_NAME}-web-compress
      - traefik.http.middlewares.${RAIJIN_NAME}-web-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow
      # Remplace la valeur vide de la production : nginx sert alors robots.txt « Disallow: / » (nginx.conf).
      - traefik.http.middlewares.${RAIJIN_NAME}-web-headers.headers.customRequestHeaders.X-Raijin-Robots=deny
      # robots.txt lisible sans mot de passe (les robots doivent pouvoir lire « Disallow: / »).
      - traefik.http.routers.${RAIJIN_NAME}-web-robots.rule=Host(`${APP_DOMAIN}`) && Path(`/robots.txt`)
      - traefik.http.routers.${RAIJIN_NAME}-web-robots.priority=200
      - traefik.http.routers.${RAIJIN_NAME}-web-robots.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME}-web-robots.tls=true
      - traefik.http.routers.${RAIJIN_NAME}-web-robots.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME}-web-robots.service=${RAIJIN_NAME}-web
      - traefik.http.routers.${RAIJIN_NAME}-web-robots.middlewares=${RAIJIN_NAME}-web-headers

  raijin-landing:
    labels:
      # basicAuth du dev (hash bcrypt, docs/DEPLOY.md C4). Même définition sur chaque conteneur exposé : le middleware
      # existe tant qu'un seul d'entre eux tourne (définitions identiques fusionnées par Traefik).
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.users=${DEV_BASIC_AUTH_USERS:?DEV_BASIC_AUTH_USERS manquant (env dev)}
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.removeheader=true
      - traefik.http.middlewares.${RAIJIN_NAME}-auth.basicauth.realm=Raijin-dev
      - traefik.http.routers.${RAIJIN_NAME}-landing.middlewares=${RAIJIN_NAME}-auth,${RAIJIN_NAME}-landing-headers,${RAIJIN_NAME}-landing-compress
      - traefik.http.middlewares.${RAIJIN_NAME}-landing-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow
      - traefik.http.middlewares.${RAIJIN_NAME}-landing-headers.headers.customRequestHeaders.X-Raijin-Robots=deny
      - traefik.http.routers.${RAIJIN_NAME}-landing-robots.rule=Host(`${LANDING_DOMAIN}`) && Path(`/robots.txt`)
      - traefik.http.routers.${RAIJIN_NAME}-landing-robots.priority=200
      - traefik.http.routers.${RAIJIN_NAME}-landing-robots.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${RAIJIN_NAME}-landing-robots.tls=true
      - traefik.http.routers.${RAIJIN_NAME}-landing-robots.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.${RAIJIN_NAME}-landing-robots.service=${RAIJIN_NAME}-landing
      - traefik.http.routers.${RAIJIN_NAME}-landing-robots.middlewares=${RAIJIN_NAME}-landing-headers
      # Pas de « www. » en dev (aucun enregistrement DNS) : le routeur de redirection hérité de la production ne vise
      # plus d'autre nom que la landing dev elle-même (aucun certificat demandé pour un nom inexistant).
      - traefik.http.routers.${RAIJIN_NAME}-www.rule=Host(`${LANDING_DOMAIN}`) && Path(`/.well-known/raijin-www-inactif`)
      - traefik.http.routers.${RAIJIN_NAME}-www.middlewares=${RAIJIN_NAME}-auth,${RAIJIN_NAME}-www-redirect
