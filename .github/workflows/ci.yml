name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'

jobs:
  verifier:
    name: lint · typecheck · test · build (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      - name: Cache Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - run: pnpm nx affected -t lint typecheck test build --parallel=3

  e2e:
    name: e2e Playwright (PR vers main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Mêmes ports hôte que docker-compose.dev.yml (5433, 6380, 1026, 8026) : la configuration de
    # développement de l'API et des suites e2e s'applique telle quelle. Identifiants factices, non secrets.
    services:
      postgres:
        image: postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: raijin
          POSTGRES_PASSWORD: changeme-factice
          POSTGRES_DB: raijin
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U raijin -d raijin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
        env:
          MP_MAX_MESSAGES: 2000
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1026:1025
          - 8026:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://raijin:changeme-factice@localhost:5433/raijin?schema=public
      REDIS_URL: redis://localhost:6380
      SMTP_HOST: localhost
      SMTP_PORT: '1026'
      MAILPIT_URL: http://localhost:8026
      MAIL_PROVIDER: smtp
      # Les suites e2e font plusieurs inscriptions par minute : limites relevées pour le test uniquement.
      RATE_LIMIT_AUTH_PER_MINUTE: '100'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      # Secrets éphémères propres à ce job (aucun secret GitHub) : l'API les générerait sinon à chaque
      # démarrage ; ici une seule valeur, masquée dans les journaux, pour les deux suites.
      - name: Secrets de test éphémères
        run: |
          for name in JWT_ACCESS_SECRET COOKIE_SECRET; do
            value="$(openssl rand -base64 48 | tr -d '\n=+/')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Cache Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Version de Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs Playwright
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromium (téléchargement + dépendances système)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Chromium (dépendances système seules, navigateur en cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Migrations Prisma
        run: pnpm nx run api-prisma:migrate-deploy

      # Deux passes séparées : api-e2e démarre l'API via api:serve (TTL JWT par défaut), web-e2e la
      # relance via le webServer Playwright (JWT_ACCESS_TTL=20s, limites hautes). Une seule commande
      # laisserait Playwright réutiliser l'API de la première suite, avec le mauvais TTL.
      - name: e2e API (si affectée)
        run: pnpm nx affected -t e2e --exclude=web-e2e --parallel=1

      - name: e2e web (si affectée)
        run: pnpm nx affected -t e2e --exclude=api-e2e --parallel=1

      - name: Captures et rapport (uniquement en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-echecs
          path: |
            dist/.playwright/**
            apps/*-e2e/test-output/**
          retention-days: 7
          if-no-files-found: ignore
