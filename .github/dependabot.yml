# Dependabot : mises à jour des actions GitHub épinglées par SHA (sécurité de la chaîne d'approvisionnement).
# Les PR ciblent `dev` (jamais `main`) et sont relues comme toute autre modification.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
