# Infrastructure locale de développement de l'API Raijin (jamais utilisée sur le VPS).
# Lancement : pnpm nx run api:dev-infra   · arrêt : pnpm nx run api:dev-infra-stop
# Ports liés à 127.0.0.1 uniquement. Les valeurs par défaut sont celles, factices, de docs/ENV.md ;
# Docker Compose lit le .env racine s'il existe (les agents ne le lisent jamais).
name: raijin-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raijin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-factice}
      POSTGRES_DB: ${POSTGRES_DB:-raijin}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit : SMTP local (1025) + interface web http://localhost:8025 (tous les e-mails de dev y arrivent).
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
